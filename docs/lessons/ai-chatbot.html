#side{padding:14px 16px;overflow:auto}

.why{font-weight:600;font-size:14px;line-height:1.4;margin:0 0 10px;color:var(--tf)}

details{border-top:1px solid var(--line);padding-top:7px;margin-top:7px}summary{cursor:pointer;font-weight:600;font-size:13.5px}pre.code{font-size:11.5px;line-height:1.5;background:var(--sunk);border-radius:8px;padding:9px;overflow:auto;margin:7px 0 5px;max-height:240px}a{color:var(--accent)}
.ask{background:var(--sunk);border-radius:12px;padding:12px;margin-bottom:10px}.ask p{margin:0 0 9px;font-weight:600;font-size:15px;line-height:1.35}.ask button{display:block;width:100%;text-align:left;margin-bottom:6px;background:var(--surface);padding:8px 10px}.ask button:hover{color:var(--accent)}
.back{color:var(--accent);font-weight:600;font-size:13px;padding:4px 8px;margin:-4px 0 8px -8px}.back:hover{background:var(--sunk)}
.isec{border-top:1px solid var(--line);margin-top:10px;padding-top:9px}.isec>.eyebrow{display:block;margin-bottom:6px}.ilink{display:block;width:100%;text-align:left;font:500 12.5px/1.35 var(--mono);color:var(--accent);padding:3px 6px;margin-left:-6px;border-radius:6px;overflow-wrap:anywhere}.ilink:hover{background:var(--sunk)}
.schips{display:flex;flex-wrap:wrap;gap:3px}.schip{font:600 12px var(--mono);min-width:26px;padding:3px 6px;background:var(--sunk);text-align:center}.schip:hover{color:var(--accent)}.schip.cur{background:var(--accent);color:var(--surface)}
.point{background:color-mix(in srgb,var(--pos) 14%,var(--surface));border-radius:9px;padding:8px 10px;font:500 12.5px/1.45 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:8px;max-height:230px;overflow:auto}

.iohead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:3px}.iohead b{font:700 11px var(--mono);letter-spacing:.05em;color:var(--c)}.iolab{font-size:13px;font-weight:600;line-height:1.25;margin-bottom:6px}

#limits{position:absolute;right:12px;top:52px;z-index:9;width:min(460px,calc(100vw - 24px));max-height:calc(100vh - 80px);overflow:auto;background:var(--surface);border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.5;box-shadow:0 10px 40px rgba(10,14,40,.26)}#limits[hidden]{display:none}#limits p{margin:0 0 8px}

eDocument for small changes. The old_string must match exactly.\ngetWeather: Get the current weather at a location. You can provide either coordinates or a city name.\nrequestSuggestions: Request writing suggestions for an existing document artifact. Only use this when the user explicitly asks to improve or get suggestions for a document they have already created. Never use for general questions.\nupdateDocument: Full rewrite of an existing artifact. Only use for major changes where most content needs replacing. Prefer editDocument for targeted changes."}]},"model":{"files":["lib/ai/providers.ts","app/(chat)/api/chat/route.ts"],"type":"node","role":"model","x":925,"y":100,"w":260,"h":92,"label":"Language model","sub":"via AI Gateway · streamText"},"tool":{"files":["lib/ai/tools/get-weather.ts"],"type":"node","role":"tool","x":925,"y":310,"w":260,"h":92,"label":"getWeather tool","sub":"code in this repo"},"ext":{"files":[],"type":"node","role":"external","x":925,"y":500,"w":260,"h":92,"label":"Open-Meteo","sub":"outside weather service"}}},"steps":[{"chapter":"You press send","title":"The message leaves your browser","cap":"A question is the only part you wrote. Most of what the model sees comes later.","plain":"Your question is wrapped in a small package with an ID and the model you picked. The server has a strict schema for this package. For example, a text part can be at most 2,000 characters.","show":["browser","route"],"flow":[{"from":"browser","to":"route","label":"POST"}],"input":{"type":"text","label":"What you typed","text":"What's the weather in Paris right now?","prov":"illustrative"},"transform":{"label":"Wrap it for the server","text":"Must match \u003ccode>postRequestBodySchema\u003c/code>."},"output":{"type":"text","label":"JSON sent to the server","text":"{\n  \"id\": \"3f6c…-uuid\",\n  \"message\": {\n    \"id\": \"9a1e…-uuid\",\n    \"role\": \"user\",\n    \"parts\": [{ \"type\": \"text\",\n      \"text\": \"What's the weather in Paris right now?\" }]\n  },\n  \"selectedChatModel\": \"…\",\n  \"selectedVisibilityType\": \"private\"\n}","prov":"illustrative"},"log":["browser","server","your message","38 chars"],"code":{"f":"app/(chat)/api/chat/schema.ts","a":17,"b":35,"must":"postRequestBodySchema","text":"const userMessageSchema = z.object({\n  id: z.uuid(),\n  parts: z.array(partSchema),\n  role: z.enum([\"user\"]),\n});\n\nconst toolApprovalMessageSchema = z.object({\n  id: z.string(),\n  parts: z.array(z.record(z.string(), z.unknown())),\n  role: z.enum([\"user\", \"assistant\"]),\n});\n\nexport const postRequestBodySchema = z.object({\n  id: z.uuid(),\n  message: userMessageSchema.optional(),\n  messages: z.array(toolApprovalMessageSchema).optional(),\n  selectedChatModel: z.string(),\n  selectedVisibilityType: z.enum([\"public\", \"private\"]),\n});"}},{"chapter":"You press send","title":"The server checks you first","cap":"Any failed check ends here. The model is never called, so it costs nothing.","plain":"Before spending money on a model, the server asks four things. Is the package valid? Is this a bot? Are you signed in? Have you hit your hourly limit? If any check fails, you get an error back.","show":["gate"],"focus":["route","gate"],"flow":[{"from":"route","to":"gate","label":"check"}],"input":{"type":"text","label":"The package and your session","text":"JSON body + login cookie + IP address","prov":"read"},"transform":{"label":"Four gates, in order","text":"parse → bot check → session → rate limit"},"output":{"type":"text","label":"All clear, or one of these errors","prov":"read","text":"Invalid package → bad_request:api\nBot            → forbidden:api\nNot signed in  → unauthorized:chat\nOver the limit → rate_limit:chat"},"log":["server","checks","pass or stop",""],"code":{"f":"app/(chat)/api/chat/route.ts","a":74,"b":112,"must":"postRequestBodySchema.parse","text":"    const json = await request.json();\n    requestBody = postRequestBodySchema.parse(json);\n  } catch {\n    return new ChatbotError(\"bad_request:api\").toResponse();\n  }\n\n  try {\n    const { id, message, messages, selectedChatModel, selectedVisibilityType } =\n      requestBody;\n\n    const [botIdResult, session] = await Promise.all([\n      checkBotId().catch(() => null),\n      auth(),\n    ]);\n\n    if (botIdResult?.isBot) {\n      return new ChatbotError(\"forbidden:api\").toResponse();\n    }\n\n    if (!session?.user) {\n      return new ChatbotError(\"unauthorized:chat\").toResponse();\n    }\n\n    const chatModel = allowedModelIds.has(selectedChatModel)\n      ? selectedChatModel\n      : DEFAULT_CHAT_MODEL;\n\n    await checkIpRateLimit(ipAddress(request));\n\n    const userType: UserType = session.user.type;\n\n    const messageCount = await getMessageCountByUserId({\n      differenceInHours: 1,\n      id: session.user.id,\n    });\n\n    if (messageCount > entitlementsByUserType[userType].maxMessagesPerHour) {\n      return new ChatbotError(\"rate_limit:chat\").toResponse();\n    }"},"ask":{"q":"You pass the hourly limit. Does the model still run?","options":["Yes, then the answer is hidden","No, the request stops before any model call","Only for short messages"],"answer":1,"explain":"The limit check returns an error well before the model call."}},{"chapter":"You press send","title":"Your history is loaded","cap":"The model keeps no memory of you. The app has to send the past each time.","plain":"The model remembers nothing between requests. So the server looks up this chat's earlier messages in the database and saves your new one. A new chat also gets a title, generated by a separate model call.","show":["db"],"focus":["route","db"],"flow":[{"from":"route","to":"db","label":"load + save"}],"input":{"type":"text","label":"Chat ID","text":"3f6c…-uuid","prov":"illustrative"},"transform":{"label":"Read and save","text":"\u003ccode>getMessagesByChatId\u003c/code>, then \u003ccode>saveMessages\u003c/code>."},"output":{"type":"text","label":"Message list","text":"[ { role: \"user\", text: \"What's the weather in Paris right now?\" } ]\n(earlier messages come first)","prov":"illustrative"},"log":["server","database","history in, your message saved",""],"code":{"f":"app/(chat)/api/chat/route.ts","a":116,"b":133,"must":"getMessagesByChatId","text":"    const chat = await getChatById({ id });\n    let messagesFromDb: DBMessage[] = [];\n    let titlePromise: Promise\u003cstring> | null = null;\n\n    if (chat) {\n      if (chat.userId !== session.user.id) {\n        return new ChatbotError(\"forbidden:chat\").toResponse();\n      }\n      messagesFromDb = await getMessagesByChatId({ id });\n    } else if (message?.role === \"user\") {\n      await saveChat({\n        id,\n        title: \"New chat\",\n        userId: session.user.id,\n        visibility: selectedVisibilityType,\n      });\n      titlePromise = generateTitleFromUserMessage({ message });\n    }"}},{"chapter":"Building what the model reads","title":"The system prompt","cap":"Bars are drawn to scale. The rules are about 55 times longer than your question.","plain":"This is text you never see, written by the app's developers. It says how to behave and when to use each tool. Here the instructions are far longer than your question, and they go along with every request.","why":"When an AI app seems to have a personality or rules, this is usually where they come from.","show":["stack"],"focus":["stack"],"segs":["sys","rules"],"flow":[{"from":"route","to":"stack","label":"assemble"}],"input":{"type":"text","label":"Does this model support tools?","text":"supportsTools = true","prov":"illustrative"},"transform":{"label":"Join text blocks","text":"regularPrompt + hints + artifactsPrompt. Without tool support, the tool rules are left out."},"output":{"type":"segments","items":[{"label":"System: who to be","size":"245 chars","color":"var(--tf)","text":"You are a helpful assistant. Keep responses concise and direct.\n\nWhen asked to write, create, or build something, do it immediately. Don't rancisco', 'New York', 'London')\")\n      .optional(),\n    latitude: z.number().optional(),\n    longitude: z.number().optional(),\n  }),"}},{"chapter":"The model loop","title":"The model answers with a request","cap":"Its first reply is a filled-in form, not text for you.","plain":"The whole bundle goes to the model. It can't know today's weather, so rather than answering, it asks for the tool, with the form filled in. The app decides nothing here: this choice is the model's.","show":["model"],"focus":["stack","model"],"flow":[{"from":"stack","to":"model","label":"whole bundle"}],"input":{"type":"segments","items":[{"label":"You: the question","size":"38 chars","color":"var(--accent)","text":"What's the weather in Paris right now?"},{"label":"Tools it may ask for","size":"884 chars+","color":"var(--out)","text":"createDocument: Create an artifact. You MUST specify kind: use 'code' for any programming/algorithm request (creates a script), 'text' for essays/writing (creates a document), 'sheet' for spreadsheets/data.\neditDocument: Make a targeted edit to an existing artifact by finding and replacing an exact string. Preferred over updateDocument for small changes. The old_string must match exactly.\ngetWeather: Get the current weather at a location. You can provide either coordinates or a city name.\nrequestSuggestions: Request writing suggestions for an existing document artifact. Only use this when the user explicitly asks to improve or get suggestions for a document they have already created. Never use for general questions.\nupdateDocument: Full rewrite of an existing artifact. Only use for major changes where most content needs replacing. Prefer editDocument for targeted changes."}],"label":"Parts it relies on here","prov":"illustrative"},"transform":{"label":"The model runs","text":"\u003ccode>streamText\u003c/code> sends instructions, messages and tools."},"output":{"type":"text","label":"Tool call","text":"{\n  \"type\": \"tool-call\",\n  \"toolName\": \"getWeather\",\n  \"input\": { \"city\": \"Paris\" }\n}","prov":"illustrative"},"log":["bundle","model","everything above → 1 tool call",""],"code":{"f":"app/(chat)/api/chat/route.ts","a":269,"b":282,"must":"streamText","text":"        const result = streamText({\n          activeTools:\n            isReasoningModel && !supportsTools\n              ? []\n              : [\n                  \"getWeather\",\n                  \"createDocument\",\n                  \"editDocument\",\n                  \"updateDocument\",\n                  \"requestSuggestions\",\n                ],\n          instructions: systemPrompt({ requestHints, supportsTools }),\n          messages: modelMessages,\n          model: getLanguageModel(chatModel),"},"ask":{"q":"Who actually gets the weather?","options":["The model looks it up itself","This app's code, after the model asks","The browser"],"answer":1,"explain":"The model only produces the request. Code in the repo runs it."}},{"chapter":"The model loop","title":"The app runs the tool","cap":"This is ordinary code, with no AI involved.","plain":"Now normal code takes over. It checks the form and turns “Paris” into coordinates using an outside service. It then requests the forecast and collects the result.","show":["ext"],"focus":["model","tool","ext"],"flow":[{"from":"model","to":"tool","label":"getWeather","kind":"tool"},{"from":"tool","to":"ext","label":"2 web requests","kind":"tool"}],"input":{"type":"text","label":"Tool call","text":"{ \"city\": \"Paris\" }","prov":"illustrative"},"transform":{"label":"Look up, then fetch","text":"\u003ccode>geocodeCity\u003c/code> → coordinates → forecast API. An unknown city returns an error message."},"output":{"type":"text","label":"Tool result","text":"{\n  \"current\": { \"temperature_2m\": 14.2 },\n  \"hourly\": { … },\n  \"daily\": { … },\n  \"cityName\": \"Paris\"\n}","prov":"illustrative"},"log":["tool","Open-Meteo","city → coordinates → forecast","2 calls"],"code":{"f":"lib/ai/tools/get-weather.ts","a":39,"b":68,"must":"geocodeCity","text":"    if (input.city) {\n      const coords = await geocodeCity(input.city);\n      if (!coords) {\n        return {\n          error: `Could not find coordinates for \"${input.city}\". Please check the city name.`,\n        };\n      }\n      ({ latitude, longitude } = coords);\n    } else if (input.latitude !== undefined && input.longitude !== undefined) {\n      const { latitude: inputLatitude, longitude: inputLongitude } = input;\n      latitude = inputLatitude;\n      longitude = inputLongitude;\n    } else {\n      return {\n        error:\n          \"Please provide either a city name or both latitude and longitude coordinates.\",\n      };\n    }\n\n    const response = await fetch(\n      `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m&hourly=temperature_2m&daily=sunrise,sunset&timezone=auto`\n    );\n\n    const weatherData = await response.json();\n\n    if (\"city\" in input) {\n      weatherData.cityName = input.city;\n    }\n\n    return weatherData;"}},{"chapter":"The model loop","title":"The result goes back to the model","cap":"The model is called again, now with the result in hand.","plain":"The result joins the conversation and the model reads everything again. It may ask for another tool or write its answer. This repeats for at most 5 rounds, a limit that stops it running forever.","why":"This request, run, read-again cycle is what people mean by an agent loop.","focus":["model","tool"],"flow":[{"from":"tool","to":"model","label":"result","kind":"loop"}],"input":{"type":"text","label":"Tool result","text":"{\n  \"current\": { \"temperature_2m\": 14.2 },\n  \"hourly\": { … },\n  \"daily\": { … },\n  \"cityName\": \"Paris\"\n}","prov":"illustrative"},"transform":{"label":"Model runs again","text":"\u003ccode>stopWhen: isStepCount(5)\u003c/code> caps the rounds."},"output":{"type":"text","label":"This time it writes text","text":"It's abou
