<title>SEP Lens</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a drafting table — the zoomable canvas is the page; a slim inspector sits beside it; the reader's own trail runs underneath. */
:root{
  --bg:#eef1f5; --canvas:#f8f9fb; --grid:#dfe4eb; --surface:#ffffff; --sunk:#e8ecf2; --ink:#16202d; --muted:#5d6979; --line:#cfd6e0;
  --accent:#2754c5; --accent-soft:#e1e8f8;
  --proc:#ffffff; --data:#e2f3f1; --data-ink:#0d6e68; --model:#ece7fb; --model-ink:#5b42b5; --ext:#fff6e6; --ext-ink:#8a5a00;
  --lit:#e0660f; --concept:#7a4fd0; --concept-bg:#f1ebfd; --concept-ink:#4a2d93; --paper-bg:#f4f1e8; --prop:#c2185b; --warn:#b07400; --ai:#fdf0e3; --ai-ink:#a8520c; --dep-ran:#d6f0df; --dep-local:#dcefee; --dep-ai:#fbe6cf; --dep-infra:#e4e6ea; --ok:#24834d; --bad:#c23b4e;
  --c0:#2754c5; --c1:#d0661f; --c2:#24834d; --c3:#8a3fb8;
  --display:"Bricolage Grotesque","Noto Sans SC",system-ui,sans-serif;
  --body:"IBM Plex Sans","Noto Sans SC","PingFang SC",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --canvas:#141a23; --grid:#202936; --surface:#1a222d; --sunk:#111821; --ink:#e3e8ef; --muted:#93a0b1; --line:#2d3846;
  --accent:#7f9fff; --accent-soft:#1d2a46;
  --proc:#1d2631; --data:#132d2c; --data-ink:#4fc9bf; --model:#251f3d; --model-ink:#b3a2ff; --ext:#33290f; --ext-ink:#f0c060;
  --lit:#ff9348; --concept:#b294ff; --concept-bg:#2a2244; --concept-ink:#d8caff; --paper-bg:#2a2820; --prop:#ff77a8; --warn:#f0b54a; --ai:#33230f; --ai-ink:#ffb36b; --dep-ran:#173826; --dep-local:#123131; --dep-ai:#3a2810; --dep-infra:#262d38; --ok:#5fcf8c; --bad:#ff7f91;
  --c0:#7f9fff; --c1:#ff9c5e; --c2:#5fcf8c; --c3:#cf8ef6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --canvas:#141a23; --grid:#202936; --surface:#1a222d; --sunk:#111821; --ink:#e3e8ef; --muted:#93a0b1; --line:#2d3846;
  --accent:#7f9fff; --accent-soft:#1d2a46;
  --proc:#1d2631; --data:#132d2c; --data-ink:#4fc9bf; --model:#251f3d; --model-ink:#b3a2ff; --ext:#33290f; --ext-ink:#f0c060;
  --lit:#ff9348; --concept:#b294ff; --concept-bg:#2a2244; --concept-ink:#d8caff; --paper-bg:#2a2820; --prop:#ff77a8; --warn:#f0b54a; --ai:#33230f; --ai-ink:#ffb36b; --dep-ran:#173826; --dep-local:#123131; --dep-ai:#3a2810; --dep-infra:#262d38; --ok:#5fcf8c; --bad:#ff7f91;
  --c0:#7f9fff; --c1:#ff9c5e; --c2:#5fcf8c; --c3:#cf8ef6; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.55}
.wrap{max-width:1560px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.mono{font-family:var(--mono)}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-family:var(--display);font-size:24px;margin:0;font-weight:700}
.crumbs{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:14px}
.crumbs button{border:none;background:none;padding:2px 6px;border-radius:5px;color:var(--accent)}
.crumbs button:last-child{color:var(--ink);font-weight:600;cursor:default}
.crumbs .sep{color:var(--muted)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:12px;align-items:start}
@media (max-width:1000px){.stage{grid-template-columns:1fr}}
.canvaswrap{position:relative;background:var(--canvas);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0;height:min(80vh,860px);min-height:460px}
svg#cv{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
svg#cv.dragging{cursor:grabbing}
.zoombar{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.zoombar button{width:32px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:7px;font-size:16px;line-height:1}
.legend{position:absolute;left:10px;top:10px;display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);background:color-mix(in srgb,var(--canvas) 85%,transparent);padding:4px 8px;border-radius:7px;pointer-events:none;max-width:calc(100% - 70px)}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1px solid var(--line)}
.caption{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:14px;min-height:38px;box-shadow:0 2px 10px rgb(0 0 0 / .06)}
.caption .ct{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.caption .cx{min-width:0}
.player{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13.5px}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 12px;font-size:13.5px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.spacer{flex:1}
/* inspector */
aside{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;min-width:0;align-content:start;max-height:min(80vh,860px);overflow:auto}
aside h2{font-family:var(--display);font-size:19px;margin:0;line-height:1.25;text-wrap:balance}
.kchip{display:inline-flex;gap:6px;align-items:center;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.io{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.io b{color:var(--muted);font-weight:500}
.io span{font-family:var(--mono);font-size:12px;min-width:0;overflow-wrap:anywhere}
.code{border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0}
.code .cf{display:flex;justify-content:space-between;gap:8px;background:var(--sunk);padding:5px 9px;font-family:var(--mono);font-size:11.5px;flex-wrap:wrap}
.code pre{margin:0;padding:8px 10px;overflow:auto;max-height:240px;font-family:var(--mono);font-size:11.5px;line-height:1.5;background:var(--surface)}
.code .ln{color:var(--muted);user-select:none;display:inline-block;width:2.6em}
.run{font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid;justify-self:start}
.run.ran{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.run.synth{color:var(--ext-ink);border-color:color-mix(in srgb,var(--ext-ink) 50%,transparent);background:var(--ext)}
.run.gpu{color:var(--muted);border-color:var(--line)}
.pin{display:flex;gap:6px}
.pin input{flex:1;min-width:0;border:1px solid var(--line);border-radius:7px;padding:5px 8px;font:inherit;font-size:13.5px;background:var(--surface);color:var(--ink)}
.qs{display:grid;gap:4px;margin:0;padding:0;list-style:none;font-size:13.5px}
.qs li{background:var(--accent-soft);border-radius:6px;padding:4px 8px}
.rate{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.rate .btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.hint{font-size:12.5px;color:var(--muted)}
/* trail */
.trail{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.trailrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tstep{border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:2px 8px;font-size:12.5px}
.tstep.q{border-color:var(--accent);background:var(--accent-soft)}
.arrow{color:var(--muted);font-size:12px}
textarea.out{width:100%;min-height:110px;font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--sunk);color:var(--ink)}
/* svg */
.grp{fill:color-mix(in srgb,var(--surface) 55%,transparent);stroke:var(--line);stroke-width:1.5}
.grp.dash{stroke-dasharray:7 5;stroke:color-mix(in srgb,var(--c1) 60%,var(--line));fill:color-mix(in srgb,var(--c1) 5%,transparent)}
.grp.outer{stroke:color-mix(in srgb,var(--accent) 55%,var(--line))}
.grp.concept{fill:color-mix(in srgb,var(--concept-bg) 55%,transparent);stroke:color-mix(in srgb,var(--concept) 45%,var(--line));stroke-dasharray:5 5}
.grp.sub{fill:color-mix(in srgb,var(--model) 40%,transparent)}
.gl{fill:var(--muted);font-family:var(--mono);font-size:14px}
.edge{fill:none;stroke:color-mix(in srgb,var(--ink) 38%,transparent);stroke-width:1.8}
.edge.k-control{stroke-dasharray:6 5}
.edge.k-loop{stroke:color-mix(in srgb,var(--accent) 70%,transparent);stroke-width:2.2}
.edge.k-infer{stroke:color-mix(in srgb,var(--c2) 80%,transparent);stroke-dasharray:8 5;stroke-width:2.2}
.edge.k-spec{stroke-dasharray:2 5;stroke-linecap:round;stroke-width:2.2}
.edge.lit{stroke:var(--lit);stroke-width:2.8;stroke-dasharray:none}
.edge.dim,.node.dim,.elab.dim{opacity:.18}
.elab rect{fill:var(--canvas);stroke:none}
.elab text{fill:var(--muted);font-family:var(--mono);font-size:12.5px}
.node{cursor:pointer}
.node rect.box{stroke:color-mix(in srgb,var(--ink) 30%,transparent);stroke-width:1.4}
.node.k-process rect.box{fill:var(--proc)}
.node.k-data rect.box{fill:var(--data);stroke:color-mix(in srgb,var(--data-ink) 55%,transparent)}
.node.k-model rect.box{fill:var(--model);stroke:color-mix(in srgb,var(--model-ink) 55%,transparent)}
.node.k-external rect.box{fill:var(--ext);stroke:color-mix(in srgb,var(--ext-ink) 55%,transparent);stroke-dasharray:5 4}
.node.k-stage rect.box{fill:var(--accent-soft);stroke:color-mix(in srgb,var(--accent) 55%,transparent)}
.node.k-repo rect.box{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.node.k-portal rect.box{fill:var(--surface);stroke:var(--accent);stroke-dasharray:6 4}
.node .t{fill:var(--ink);font-size:17px;font-weight:600;font-family:var(--body)}
.node .s{fill:var(--muted);font-size:12.5px;font-family:var(--mono)}
.node.k-repo .t{font-family:var(--display);font-size:21px}
.node:hover rect.box{stroke:var(--accent)}
.node.sel rect.box{stroke:var(--accent);stroke-width:3}
.node.lit rect.box{stroke:var(--lit);stroke-width:2.6}
.node.pulse rect.box{animation:pulse .6s ease}
@keyframes pulse{0%{stroke-width:6;stroke:var(--lit)}100%{stroke-width:2.6}}
.drill circle{fill:var(--accent)} .drill path{stroke:#fff;stroke-width:1.8;fill:none}
.visited{fill:var(--ok)}
.pinflag rect{fill:var(--accent)} .pinflag text{fill:#fff;font-size:11px;font-family:var(--mono);font-weight:600}
.tag rect{fill:var(--lit);opacity:.12;stroke:var(--lit);stroke-width:1}
.tag text{fill:var(--ink);font-family:var(--mono);font-size:13px;font-weight:600}
.pkt circle{fill:var(--lit)}
.pkt rect{fill:var(--lit)}
.pkt text{fill:#fff;font-family:var(--mono);font-size:14px;font-weight:600}
.cvtext{fill:var(--ink);font-family:var(--body)}
.cvmuted{fill:var(--muted);font-family:var(--mono);font-size:12px}
.cvbig{fill:var(--ink);font-family:var(--mono);font-size:30px;font-weight:600}

.node.k-ai rect.box{fill:var(--ai);stroke:color-mix(in srgb,var(--ai-ink) 70%,transparent);stroke-width:2}
.node.k-gate rect.box{fill:var(--surface);stroke:var(--ink);stroke-width:2;stroke-dasharray:3 3}
.node.k-store rect.box{fill:var(--sunk);stroke:color-mix(in srgb,var(--ink) 35%,transparent)}
.node.k-agent rect.box{fill:var(--surface);stroke:color-mix(in srgb,var(--ink) 35%,transparent);rx:30}
.aimark{fill:var(--ai-ink);font-family:var(--mono);font-size:11px;font-weight:600}
.warnmark{display:none} .warnmark circle{fill:var(--bad)} .warnmark text{fill:#fff;font-weight:700;font-size:13px;font-family:var(--mono)}
svg.repro .warnmark{display:inline}
svg.repro .node rect.box{fill:var(--surface)}
svg.repro .node.dep-ran rect.box{fill:var(--dep-ran)} svg.repro .node.dep-local rect.box{fill:var(--dep-local)}
svg.repro .node.dep-ai rect.box{fill:var(--dep-ai)} svg.repro .node.dep-infra rect.box{fill:var(--dep-infra)}
.preview{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--canvas)}
.preview svg{display:block;width:100%;height:auto}
.aiio{display:grid;gap:8px}
.iobox{border:1px solid color-mix(in srgb,var(--ai-ink) 35%,var(--line));border-radius:8px;overflow:hidden;min-width:0}
.iohead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--ai);padding:5px 9px;font-size:12.5px}
.iohead a{font-family:var(--mono);font-size:11px;margin-left:auto}
.iobox pre{margin:0;padding:8px 10px;max-height:220px;overflow:auto;font-family:var(--mono);font-size:11.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface)}
.prov{font-size:11px;padding:0 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.prov.p-data{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent);font-weight:600}
.prov.p-run{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.prov.p-test,.prov.p-eval,.prov.p-example{color:var(--ext-ink);border-color:color-mix(in srgb,var(--ext-ink) 50%,transparent)}
.repro{display:grid;gap:6px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--sunk)}
.rgrid{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:13.5px}
.rgrid b{color:var(--muted);font-weight:600;font-size:12.5px;white-space:nowrap}
.dep{justify-self:start;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px}
.dep.d-ran{background:var(--dep-ran);color:var(--ok)} .dep.d-local{background:var(--dep-local);color:var(--data-ink)}
.dep.d-ai{background:var(--dep-ai);color:var(--ai-ink)} .dep.d-infra{background:var(--dep-infra);color:var(--muted)}
.wbbox{fill:color-mix(in srgb,var(--c0) 14%,var(--surface));stroke:var(--c0);stroke-width:2}

.frames{display:flex;gap:6px;flex-wrap:wrap}
.frame{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 11px 5px 6px;font-size:13.5px;display:inline-flex;gap:7px;align-items:center}
.frame .fn{width:20px;height:20px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-family:var(--mono);font-size:11.5px}
.frame[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.frame[aria-current="true"] .fn{background:var(--accent);color:#fff}
.node.k-concept rect.box{fill:var(--concept-bg);stroke:var(--concept);stroke-width:1.6}
.node.k-concept .t{fill:var(--concept-ink)}
.conmark{fill:var(--concept);font-family:var(--mono);font-size:11px;font-weight:600}
.node.k-paper rect.box{fill:var(--paper-bg);stroke:color-mix(in srgb,var(--ink) 40%,transparent);stroke-width:1.4}
.papmark{fill:var(--muted);font-family:var(--mono);font-size:11px;font-weight:600}
.node.k-proposed rect.box{fill:var(--surface);stroke:var(--prop);stroke-width:2.4;stroke-dasharray:7 5}
.propmark{fill:var(--prop);font-family:var(--mono);font-size:11px;font-weight:700}
.node.k-question rect.box{fill:var(--surface);stroke:var(--muted);stroke-dasharray:3 4}
.qmark{fill:var(--muted);font-family:var(--mono);font-size:11px;font-weight:600}
.node.k-pattern rect.box{fill:var(--ink);stroke:none} .node.k-pattern .t{fill:var(--surface)} .node.k-pattern .s{fill:color-mix(in srgb,var(--surface) 70%,transparent)}
.node.k-lever rect.box{fill:var(--surface);stroke:var(--bad);stroke-width:2}
.node.anchor rect.box{stroke:var(--prop);stroke-width:4}
.edge.k-concept,.edge.k-prereq{stroke:color-mix(in srgb,var(--concept) 60%,transparent);stroke-dasharray:4 4;stroke-width:1.6}
.edge.k-proposed{stroke:var(--prop);stroke-dasharray:8 5;stroke-width:2.4}
.edge.k-match{stroke:var(--ok);stroke-width:2.6}
.edge.k-approx{stroke:var(--warn);stroke-width:2.6;stroke-dasharray:9 5}
.edge.k-diverge{stroke:var(--bad);stroke-width:2.8;stroke-dasharray:3 4}
.edge.k-nocompare{stroke:var(--muted);stroke-width:2;stroke-dasharray:1 5;stroke-linecap:round}
.concept{display:grid;gap:8px}
.concept .def{font-size:15px;line-height:1.6}
.formula{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:17px;background:var(--sunk);border-radius:8px;padding:8px 12px;overflow-x:auto;line-height:1.7}
.crow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cchip{border:1px solid var(--concept);background:var(--concept-bg);color:var(--concept-ink);border-radius:999px;padding:1px 10px;font-size:12.5px}
.cchip.code{border-color:var(--line);background:var(--surface);color:var(--ink)}
.linkish{border:none;background:none;color:var(--accent);padding:0;font-size:13px;text-decoration:underline;text-underline-offset:2px}
.maps{display:grid;gap:8px}
.map{border-left:4px solid var(--line);padding:6px 10px;background:var(--sunk);border-radius:0 8px 8px 0;font-size:13.5px}
.map p{margin:4px 0 0}
.map .mh{display:flex;gap:8px;align-items:center}
.map .st{font-size:11.5px;font-weight:700;padding:0 7px;border-radius:999px}
.map.s-ok{border-color:var(--ok)} .map.s-ok .st{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.map.s-warn{border-color:var(--warn)} .map.s-warn .st{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.map.s-bad{border-color:var(--bad)} .map.s-bad .st{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.map.s-muted .st{color:var(--muted);background:var(--surface)}
.files{display:grid;gap:4px}
.fileln{display:grid;gap:1px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12.5px}
.fileln .mono{color:var(--accent);font-size:11.5px;overflow-wrap:anywhere}
.ivtext{width:100%;min-height:80px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;background:var(--surface);color:var(--ink);resize:vertical}
.fr{display:grid;gap:7px;border-top:2px dashed var(--prop);padding-top:10px}
.fr h3{margin:0;font-family:var(--display);font-size:17px;line-height:1.3}
.fr p,.fr ul{margin:0;font-size:13.5px} .fr ul{padding-left:18px;display:grid;gap:3px}
.chg{display:grid;gap:6px} .chg>div{border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:13px;display:grid;gap:2px}
.chg .mono{font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.dnav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lev{display:grid;gap:8px}
.lev .diff{font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow-x:auto;line-height:1.5}

VIEWS.directory = function(opts){
  return function(ctx){
    const inv = opts.inventory.filter(f => !/(^|\/)README\.md$/.test(f.path));

    const colOfTop = {}, load = [0, 0]; tops.slice().sort((a, b) => size[b] - size[a]).forEach(t => { const c = tops.length === 1 ? 1 : (load[0] <= load[1] ? 0 : 1); colOfTop[t] = c; load[c] += size[t]; });

    sorted.forEach(f => {

      for (let d = 0; d < parts.length - 1; d++){ const dir = parts.slice(0, d + 1).join("/"); if (!seen.has(dir)){ seen.add(dir); rows.push({ dir: true, name: parts[d] + "/", depth: d, path: dir, col: c }); } }

    }

  if (first && NODES[n]) redrawNode(n), NODES[n].g.classList.toggle("sel", selected===n);
}
function renderTrail(){
  const box = $("#trail"); if (!trail.length){ box.innerHTML = `<span class="hint">还没有痕迹。点任何节点开始。</span>`; return; }
  const recent = trail.slice(-40);
  box.innerHTML = recent.map((t,i) => `<button class="tstep ${t.q?"q":""}" data-i="${trail.length-recent.length+i}" title="${esc(GRAPHS[t.g]?.title||"")}">${t.q?"? "+esc(t.q):esc(t.label)}</button>`).join(`<span class="arrow">→</span>`);
  box.querySelectorAll("button").forEach(b => b.onclick = () => { const t = trail[+b.dataset.i]; jumpTo(t.g, t.n); });
}
function jumpTo(gid, nid){
  if (G.id !== gid){ const path = pathTo(gid); if (!path) return; stack = path; load(gid); }
  if (nid && NODES[nid]){ select(nid); const n = NODES[nid]; tweenView({x:n.x-n.w*2, y:n.y-n.h*4, w:n.w*4, h:n.h*8}, 350); }
}
function pathTo(gid){ const seen = {}; const q = [["meta"]]; while (q.length){ const p = q.shift(), g = GRAPHS[p[p.length-1]]; if (g.id===gid) return p; (g.nodes||[]).filter(n=>n.drill).forEach(n => { if (!seen[n.drill]){ seen[n.drill]=1; q.push([...p, n.drill]); } }); } return GRAPHS[gid] ? (gid==="meta"?["meta"]:["meta", gid]) : null; }
$("#cleartrail").onclick = () => { trail = []; store.set("trail", trail); renderTrail(); load(G.id); };
$("#exportb").onclick = () => {
  const out = JSON.stringify({tool:"Code Anatomy", page:(typeof PAGE!=="undefined"&&PAGE.id)||"", profile, predictions:{total:predictLog.length, correct:predictLog.filter(x=>x.ok).length, log:predictLog}, trail, questions:pins, understood:rates}, null, 1);
  const ta = $("#out"); ta.value = out; ta.hidden = false; ta.select();
  try{ navigator.clipboard.writeText(out).then(()=>$("#exportb").textContent="已复制", ()=>$("#exportb").textContent="请手动复制"); }catch(e){ $("#exportb").textContent = "请手动复制"; }
};

/* ---------------- custom graph context ---------------- */
function customCtx(){
  return { g: L.custom, el, pill, sleep, caption, speed: () => speed, reduced,
    inspect(html){ $("#insp").innerHTML = html; wireGoto(); },
    jump(g, n){ jumpTo(g, n); },
    visit(n,label){ visit(G.id, n, label); } };
}


/* ---------------- intervention: describe a change → grounded feature request ---------------- */
let samplePromise = (window.claude && typeof window.claude.use === "function") ? window.claude.use("sample").catch(() => null) : Promise.resolve(null);
let ivState = { text: "", result: null, busy: false, ctl: null, note: "" };
function toggleAnchor(id){ const i = anchors.indexOf(id); if (i >= 0) anchors.splice(i, 1); else anchors.push(id); redrawNode(id); renderIntervene(); }
$("#intervb").onclick = () => openIntervene();
function openIntervene(){ if (!G.intervene) return; anchorMode = true; renderIntervene(); }
function closeIntervene(){ anchorMode = false; const a = anchors.slice(); anchors = []; a.forEach(redrawNode); inspectGraph(); }
function contextPack(){
  const nodes = G.nodes.filter(n => n.kind !== "proposed").map(n => {
    const files = []; if (n.code) files.push(`${n.code.f}:${n.code.a}-${n.code.b}`);
    if (n.aiio) ["input","output"].forEach(k => { const r = n.aiio[k]; if (r && r.f) files.push(`${r.f}:${r.a}-${r.b}`); });
    return { id: n.id, label: n.label, sub: n.sub || "", kind: n.kind || "process", role: (n.role || "").replace(/<[^>]+>/g, "").slice(0, 200), files, limit: n.repro && n.repro.limit ? n.repro.limit.replace(/<[^>]+>/g, "").slice(0, 200) : undefined };
  });
  const edges = G.edges.map(e => ({ from: e.from, to: e.to, label: e.label || "" }));
  const dirs = [...new Set((G.intervene.files || []).map(f => f.replace(/[^/]+$/, "")))].slice(0, 400);
  return JSON.stringify({ repo: G.intervene.repo, nodes, edges, conventions: G.intervene.conventions, facts: G.intervene.facts, directories: dirs });
}
function buildPrompt(text){
  return `You are a staff engineer who has read this repository and its component graph. A learner proposes a change. Write a feature request grounded ONLY in the components, files and conventions given below. Do not invent files that are not plausible extensions of the listed paths; when you propose a new file, put it next to the related existing files and say it is new.

Write all prose fields in Simplified Chinese; keep identifiers, paths and code in English.

Learner's proposal:
"""${text}"""
${anchors.length ? `Components the learner marked on the graph as related: ${anchors.join(", ")}` : "The learner did not mark components."}

Repository graph and conventions (JSON):
${contextPack()}

Reply with ONLY one JSON object of this shape:
{"title": string,
 "summary": string (2-3 sentences: what changes and why),
 "grounding": [string] (2-4 facts from the given graph/conventions that motivate or constrain this change, each naming the node id or file),
 "new_components": [{"id": "new_<snake>", "label": short, "sub": short, "kind": "process"|"ai"|"store"|"data", "role": string, "near": existing node id}],
 "edges": [{"from": id, "to": id, "label": short}] (connect new components to existing node ids; only use ids that exist or that you created),
 "flow": [{"from": id, "to": id, "payload": short, "caption": one sentence}] (4-9 steps of one request going through the changed system; every step must follow an edge that exists in the graph or in your "edges"),
 "changes": [{"node": existing id, "file": path, "change": string}],
 "contracts": [{"name": string, "shape": string}],
 "risks": [string], "tests": [string], "eval": string, "open_questions": [string]}`;
}
function validateProposal(p){
  const ids = new Set(G.nodes.map(n => n.id));
  const news = (p.new_components || []).filter(c => c && c.id && !ids.has(c.id)).slice(0, 4);
  news.forEach(c => ids.add(c.id));
  const edges = (p.edges || []).filter(e => e && ids.has(e.from) && ids.has(e.to));
  const edgeSet = new Set([...G.edges.map(e => e.from + ">" + e.to), ...edges.map(e => e.from + ">" + e.to)]);
  const flow = (p.flow || []).filter(s => s && edgeSet.has(s.from + ">" + s.to));
  const inv = new Set((G.intervene && G.intervene.files) || []);
  const changes = (p.changes || []).map(c => ({ ...c, fileStatus: !c.file ? "none" : inv.has(c.file) ? "exists" : inv.size && [...inv].some(f => f.startsWith(c.file.replace(/[^/]+$/, ""))) ? "new" : inv.size ? "unknown" : "unchecked" }));
  return { ...p, changes, new_components: news, edges, flow, dropped: (p.flow || []).length - flow.length };
}
function placeProposal(p){
  const W = G.world; let x0 = 0;
  G.nodes = G.nodes.filter(n => n.kind !== "proposed"); G.edges = G.edges.filter(e => !e.proposed);
  G.scenarios = (G.scenarios || []).filter(s => !s.proposed);
  const band = W.h + 60;
  p.new_components.forEach((c, i) => {
    const near = G.nodes.find(n => n.id === c.near);
    const x = near ? Math.min(W.w - 140, Math.max(140, near.x + (i % 2 ? 60 : -60))) : 200 + i * 300;
    G.nodes.push({ id: c.id, x: x + x0, y: band + (i % 2) * 110, label: c.label || c.id, sub: c.sub || "", kind: "proposed", w: 240, role: c.role || "", proposedKind: c.kind });
    x0 += 0;
  });
  p.edges.forEach(e => G.edges.push({ from: e.from, to: e.to, label: e.label || "", kind: "proposed", proposed: true }));
  if (p.flow.length) G.scenarios.push({ name: "提议：" + (p.title || "改动").slice(0, 8) + ((p.title || "").length > 8 ? "…" : ""), proposed: true, intro: p.summary || "", steps: p.flow.map(s => ({ e: s.from + ">" + s.to, p: s.payload || "", c: s.caption || "" })) });
}
function fmtList(a){ return (a || []).map(x => `<li>${esc(x)}</li>`).join(""); }
function proposalHtml(p, source){
  return `<div class="fr">
    <div class="frh"><span class="prov ${source === "live" ? "p-run" : "p-example"}">${source === "live" ? "Claude 刚刚基于这张图生成" : "示例：我基于代码写的，非实时生成"}</span></div>
    <h3>${esc(p.title || "")}</h3><p>${esc(p.summary || "")}</p>
    ${p.grounding && p.grounding.length ? `<span class="label">依据（来自仓库）</span><ul>${fmtList(p.grounding)}</ul>` : ""}
    ${p.changes && p.changes.length ? `<span class="label">要改的地方</span><div class="chg">${p.changes.map(c => `<div><button class="linkish" data-goto="${esc(c.node)}">${esc((G.nodes.find(n => n.id === c.node) || {}).label || c.node)}</button><span class="mono">${esc(c.file || "")} ${c.fileStatus ? `<span class="fst f-${c.fileStatus}">${({exists:"仓库里有这个文件",new:"新文件（目录存在）",unknown:"⚠ 仓库里找不到",unchecked:"",none:""})[c.fileStatus]}</span>` : ""}</span><p>${esc(c.change || "")}</p></div>`).join("")}</div>` : ""}
    ${p.contracts && p.contracts.length ? `<span class="label">数据契约</span>${p.contracts.map(c => `<div class="iobox"><div class="iohead"><b>${esc(c.name)}</b></div><pre>${esc(c.shape)}</pre></div>`).join("")}` : ""}
    ${p.risks && p.risks.length ? `<span class="label">风险</span><ul>${fmtList(p.risks)}</ul>` : ""}
    ${p.tests && p.tests.length ? `<span class="label">测试</span><ul>${fmtList(p.tests)}</ul>` : ""}
    ${p.eval ? `<span class="label">怎么判断有没有用</span><p>${esc(p.eval)}</p>` : ""}
    ${p.open_questions && p.open_questions.length ? `<span class="label">还没想清楚的</span><ul>${fmtList(p.open_questions)}</ul>` : ""}
    ${p.dropped ? `<p class="hint">有 ${p.dropped} 步数据流引用了图上不存在的连线，已略去。</p>` : ""}
    <div class="dnav"><button class="btn" id="frcopy">复制为 Markdown</button></div>
  </div>`;
}
function proposalMd(p){
  const L = [`# ${p.title}`, "", p.summary || "", ""];
  if (p.grounding?.length) L.push("## 依据", ...p.grounding.map(x => "- " + x), "");
  if (p.changes?.length) L.push("## 改动", ...p.changes.map(c => `- **${c.node}** \`${c.file}\`：${c.change}`), "");
  if (p.new_components?.length) L.push("## 新组件", ...p.new_components.map(c => `- **${c.label}**（${c.kind}，靠近 ${c.near}）：${c.role}`), "");
  if (p.contracts?.length) L.push("## 数据契约", ...p.contracts.map(c => `- ${c.name}: \`${c.shape}\``), "");
  if (p.flow?.length) L.push("## 数据流", ...p.flow.map((s, i) => `${i + 1}. ${s.from} → ${s.to}（${s.payload}）：${s.caption}`), "");
  ["risks:风险", "tests:测试", "open_questions:待定问题"].forEach(k => { const [f, t] = k.split(":"); if (p[f]?.length) L.push("## " + t, ...p[f].map(x => "- " + x), ""); });
  if (p.eval) L.push("## 评估", p.eval);
  return L.join("\n");
}
function showProposal(p, source){
  placeProposal(p); ivState.result = { p, source };
  load(G.id); anchorMode = true;
  const si = (G.scenarios || []).findIndex(s => s.proposed);
  if (si >= 0 && player){ player.select(si); renderScens(si); }
  renderIntervene();
}
async function renderIntervene(){
  if (!G.intervene) return;
  const sample = await samplePromise;
  const r = ivState.result;
  $("#insp").innerHTML = `<span class="kchip">干预 · 提议一个改动</span><h2>你想给它加什么？</h2>
    <p>用一句话描述，再在图上<b>点选</b>相关的组件（点选模式已打开，被选中的组件会加粗）。生成的 feature request 只会引用这张图上的组件和文件。</p>
    <textarea id="ivtext" class="ivtext" placeholder="${esc(G.intervene.placeholder)}">${esc(ivState.text)}</textarea>
    <div class="crow"><span class="label">已标记</span>${anchors.length ? anchors.map(id => `<button class="cchip" data-un="${id}">${esc((G.nodes.find(n => n.id === id) || {}).label || id)} ×</button>`).join("") : '<span class="hint">还没有，直接点图上的节点</span>'}</div>
    <div class="dnav">
      ${sample ? `<button class="btn primary" id="ivgo" ${ivState.busy ? "disabled" : ""}>${ivState.busy ? "生成中…" : "生成 feature request"}</button>${ivState.busy ? '<button class="btn" id="ivstop">停止</button>' : ""}` : `<span class="hint">这个页面打开的方式不能调用 Claude，可以先看示例。</span>`}
      <button class="btn" id="ivex">看示例</button>
      <button class="btn" id="ivclose">退出</button>
    </div>
    ${ivState.note ? `<p class="hint">${esc(ivState.note)}</p>` : ""}
    ${r ? proposalHtml(r.p, r.source) : ""}`;
  wireGoto();
  $("#ivtext").oninput = e => { ivState.text = e.target.value; };
  document.querySelectorAll("#insp [data-un]").forEach(b => b.onclick = () => toggleAnchor(b.dataset.un));
  $("#ivclose").onclick = closeIntervene;
  $("#ivex").onclick = () => { const ex = G.intervene.example; ivState.text = ex.prompt; anchors = ex.anchors.slice(); ivState.note = ""; showProposal(validateProposal(ex.result), "example"); };
  const go = $("#ivgo"); if (go) go.onclick = () => generate(sample);
  const st = $("#ivstop"); if (st) st.onclick = () => ivState.ctl && ivState.ctl.abort();
  const cp = $("#frcopy"); if (cp && r) cp.onclick = () => { const md = proposalMd(r.p); try { navigator.clipboard.writeText(md).then(() => cp.textContent = "已复制", () => cp.textContent = "复制失败"); } catch (e) { cp.textContent = "复制失败"; } };
}
async function generate(sample){
  const text = ($("#ivtext").value || "").trim(); if (!text){ ivState.note = "先写一句你想加的功能。"; return renderIntervene(); }
  ivState.text = text; ivState.busy = true; ivState.note = "Claude 在读这张图和相关文件，通常需要 20–60 秒。"; ivState.ctl = new AbortController(); renderIntervene();
  try {
    const p = await sample.json(buildPrompt(text), { signal: ivState.ctl.signal, modelTier: "default", onText: ({ text }) => { ivState.note = `正在写… 已生成 ${text.length} 字`; const h = document.querySelector("#insp .hint"); if (h) h.textContent = ivState.note; } });
    ivState.busy = false; ivState.note = "";
    if (!p || typeof p !== "object" || !p.title){ ivState.note = "返回的内容不完整，可以再试一次或把描述写得更具体。"; return renderIntervene(); }
    showProposal(validateProposal(p), "live");
  } catch (err) {
    ivState.busy = false;
    ivState.note = ({ cancelled: "已停止。", not_granted: "没有授权这个页面使用 Claude。可以先看示例。", rate_limited: "调用太频繁，稍后再试。", invalid_json: "返回的不是完整的 JSON，可以再试一次。", prompt_too_large: "上下文太大。" })[err && err.code] || "生成失败，可以再试一次。";
    renderIntervene();
  }
}

/* ---------------- interaction mode: learner profile → route ---------------- */
let onb = { step: 0, draft: {} };
function conceptPool(){ const seen = {}; Object.values(GRAPHS).forEach(g => (g.nodes || []).forEach(n => { if (n.kind === "concept" && n.layer === "concept" && !seen[n.id]) seen[n.id] = { id: n.id, label: n.label, g: g.id }; })); return Object.values(seen); }
function onbQuestions(d){
  const qs = [{ key: "goal", q: "你这次最想做什么？", sub: "不同目标看的图和顺序不一样。", options: PROFILE.goals }];
  if (d.goal === "understand" || d.goal === "reproduce") qs.push({ key: "known", multi: true, q: "这些概念里，哪些你已经熟悉？", sub: "熟悉的会被收起，概念路线也会跳过它们。都不熟悉就直接下一步。", options: conceptPool().map(c => ({ id: c.id, label: c.label })) });
  if (d.goal === "intervene") qs.push({ key: "change", text: true, q: "你想改什么、或者想验证什么假设？", sub: "一句话就行，会带到“提议改动”里。可以留空。", placeholder: PROFILE.changePlaceholder || "" });
  if (d.goal === "transfer") qs.push({ key: "target", text: true, q: "你想把这些做法用到哪里？", sub: "比如你自己的项目或研究问题。会用来生成迁移实验。", placeholder: PROFILE.targetPlaceholder || "" });
  qs.push({ key: "time", q: "这次有多少时间？", sub: "决定路线的长度。", options: PROFILE.times });
  return qs;
}
function renderOnb(){
  const box = $("#onb"); const qs = onbQuestions(onb.draft); const q = qs[onb.step]; box.hidden = false;
  const val = onb.draft[q.key];
  box.innerHTML = `<div class="onbcard" role="dialog" aria-label="设定学习目标">
    <div class="onbtop"><span class="label">开始之前 · ${onb.step + 1} / ${qs.length}</span><button class="linkish" id="onbskip">跳过，直接看全部</button></div>
    <h2>${esc(q.q)}</h2><p class="hint">${esc(q.sub)}</p>
    ${q.text ? `<textarea id="onbtext" class="ivtext" placeholder="${esc(q.placeholder)}">${esc(val || "")}</textarea>` :
      `<div class="onbopts ${q.multi ? "multi" : ""}">${q.options.map(o => { const on = q.multi ? (val || []).includes(o.id) : val === o.id; return `<button class="onbopt" aria-pressed="${on}" data-o="${esc(o.id)}"><b>${esc(o.label)}</b>${o.sub ? `<span>${esc(o.sub)}</span>` : ""}</button>`; }).join("")}</div>`}
    <div class="dnav"><button class="btn" id="onbback" ${onb.step ? "" : "disabled"}>上一步</button><span class="spacer"></span><button class="btn primary" id="onbnext">${onb.step === qs.length - 1 ? "生成我的路线" : "下一步"}</button></div></div>`;
  box.querySelectorAll(".onbopt").forEach(b => b.onclick = () => { const id = b.dataset.o;
    if (q.multi){ const a = new Set(onb.draft[q.key] || []); a.has(id) ? a.delete(id) : a.add(id); onb.draft[q.key] = [...a]; renderOnb(); }
    else { onb.draft[q.key] = id; if (onb.step < qs.length - 1){ onb.step++; } renderOnb(); } });
  const t = $("#onbtext"); if (t) t.oninput = e => { onb.draft[q.key] = e.target.value; };
  $("#onbback").onclick = () => { onb.step = Math.max(0, onb.step - 1); renderOnb(); };
  $("#onbskip").onclick = () => { box.hidden = true; };
  $("#onbnext").onclick = () => { if (!q.text && !q.multi && !onb.draft[q.key]) return; if (onb.step < qs.length - 1){ onb.step++; renderOnb(); } else finishOnb(); };
}
function finishOnb(){
  const d = onb.draft; profile = { goal: d.goal, known: d.known || [], time: d.time || "60", change: d.change || "", target: d.target || "", at: Date.now() };
  store.set("profile", profile); $("#onb").hidden = true;
  const G0 = PROFILE.goals.find(g => g.id === profile.goal) || {};
  if (G0.predict !== undefined){ predictOn = G0.predict; store.set("predict", predictOn); applyPredict(); }
  if (G0.repro !== undefined){ reproOn = G0.repro; store.set("repro", reproOn); applyRepro(); }
  layers.concept = (profile.goal === "understand" || profile.goal === "reproduce"); store.set("layers", layers);
  if (profile.change) ivState.text = profile.change;
  renderProfileChip(); const { route } = routeFrames(); if (route.length) openFrame(route[0]); else renderFrames();
}
function renderProfileChip(){
  const b = $("#profb"); if (!b) return;
  if (!profile){ b.textContent = "设定目标"; return; }
  const goal = (PROFILE.goals.find(g => g.id === profile.goal) || {}).label || "";
  const unknown = conceptPool().length - (profile.known || []).length;
  const pr = predictLog.length ? ` · 预测 ${predictLog.filter(x => x.ok).length}/${predictLog.length}` : "";
  b.textContent = `${goal} · ${(PROFILE.times.find(t => t.id === profile.time) || {}).label || ""} · ${unknown} 个概念待学${pr}`;
}
$("#profb").onclick = () => { onb = { step: 0, draft: profile ? { ...profile } : {} }; renderOnb(); };

/* ---------------- boot ---------------- */
const hash = (location.hash||"").slice(1).replace(/-/g,".");
if (hash && GRAPHS[hash]) { const p = pathTo(hash); if (p) stack = p; }
load(stack[stack.length-1]); renderTrail(); applyRepro(); applyPredict(); renderProfileChip();
if (!profile && PAGE.defaultProfile) { onb = { step: 0, draft: { ...PAGE.defaultProfile } }; finishOnb(); }
else if (!profile && PROFILE.goals.length && !hash) { onb = { step: 0, draft: {} }; renderOnb(); }
window.addEventListener("resize", () => {});

</script>
