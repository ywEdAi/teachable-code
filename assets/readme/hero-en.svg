<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
  <title id="title">Teachable Code</title>
  <desc id="desc">An agent skill for interactive 2D and 3D lessons. The mini-sglang specimen shows seven reused tokens and two newly computed tokens.</desc>
